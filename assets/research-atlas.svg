<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="364" viewBox="0 0 1200 364" role="img" aria-labelledby="title desc">
  <title id="title">From perception to action — research trajectory</title>
  <desc id="desc">Published foundations in 3D, panoramic and multispectral computer vision support current work in agentic robotics at Duke (Kunshan) University. World-action models, vision-language-action and dexterous manipulation are developing research directions.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09121a"/><stop offset="1" stop-color="#10212c"/></linearGradient>
    <linearGradient id="path"><stop stop-color="#789aa9"/><stop offset=".5" stop-color="#b9e1ec"/><stop offset="1" stop-color="#dfb38b"/></linearGradient>
    <style>.sans{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace;letter-spacing:1.4px}.display{font-family:Georgia,Times New Roman,serif}</style>
  </defs>
  <rect x=".75" y=".75" width="1198.5" height="362.5" rx="24" fill="url(#bg)" stroke="#324b5b" stroke-width="1.5"/>
  <text x="44" y="46" fill="#a9ddea" font-size="12" class="mono">RESEARCH TRAJECTORY</text><text x="1156" y="46" fill="#8aa5b5" font-size="11" class="mono" text-anchor="end">EXPLORE THE ATLAS ↗</text>
  <path d="M63 94H1137" stroke="url(#path)" stroke-opacity=".45"/>
  <g fill="#9cb6c4"><circle cx="63" cy="94" r="5"/><circle cx="440" cy="94" r="5" fill="#b9e1ec"/><circle cx="835" cy="94" r="5" fill="#dfb38b"/></g>
  <path d="M1116 90L1121 94 1116 98" fill="none" stroke="#dfb38b"/><path d="M399 132V298M792 132V298" stroke="#91b5c9" stroke-opacity=".15"/>
  <g class="sans">
    <text x="44" y="145" fill="#8fa7b5" font-size="12" class="mono">01 / PUBLISHED FOUNDATION</text>
    <text x="44" y="190" fill="#e4edf2" font-size="32" class="display">Computer vision</text>
    <text x="44" y="227" fill="#9cb3c1" font-size="17">3D &amp; panoramic perception</text><text x="44" y="255" fill="#9cb3c1" font-size="17">Remote &amp; multispectral sensing</text><text x="44" y="283" fill="#9cb3c1" font-size="17">Representations &amp; scene understanding</text>
    <text x="432" y="145" fill="#a9ddea" font-size="12" class="mono">02 / CURRENT WORK</text>
    <text x="432" y="190" fill="#eff5f7" font-size="32" class="display">Agentic robotics</text>
    <text x="432" y="227" fill="#b2c7d3" font-size="17">Embodied intelligence</text><text x="432" y="255" fill="#b2c7d3" font-size="17">Duke (Kunshan) University</text><text x="432" y="283" fill="#8ba7b8" font-size="13" class="mono">SEP 2026 — PRESENT</text>
    <text x="827" y="145" fill="#dfb38b" font-size="12" class="mono">03 / EXPLORING NEXT</text>
    <text x="827" y="190" fill="#e9e5df" font-size="32" class="display">Models → action</text>
    <text x="827" y="227" fill="#b9bec2" font-size="17">World–action models · WAM</text><text x="827" y="255" fill="#b9bec2" font-size="17">Vision–language–action · VLA</text><text x="827" y="283" fill="#b9bec2" font-size="17">Dexterous manipulation</text>
  </g>
  <text x="44" y="335" fill="#728e9f" font-size="11" class="mono">PERCEPTION IS THE START. ACTION IS THE FRONTIER.</text>
</svg>
