    <g fill="none" stroke="#7495a9" stroke-width="1.5"><circle cx="1000" cy="242" r="13"/><circle cx="963" cy="126" r="15"/><circle cx="858" cy="164" r="11"/></g>
    <path d="M833 220L853 225 850 241 829 236Z" fill="url(#metal)"/>
    <path d="M831 237L824 252 830 259M848 241L846 257 837 261" fill="none" stroke="#c6d9e3" stroke-width="5" stroke-linejoin="round"/>
    <g transform="translate(838 293)"><ellipse rx="36" ry="11" fill="#9fcbd9" opacity=".08"/><path d="M-19 -23L0 -32 20 -22 0 -13Z" fill="#e8c69a"/><path d="M-19 -23V-2L0 8V-13Z" fill="#b58e61"/><path d="M0 -13L20 -22V-1L0 8Z" fill="#d2ab79"/><path d="M-28 -4V7L-16 13M17 12L29 5V-6" stroke="#a9ddea" fill="none" opacity=".7"/></g>
    <circle cx="788" cy="187" r="3" fill="#a9ddea" class="signal next"/><circle cx="1064" cy="200" r="3" fill="#dfb38b" class="signal last"/>
    <text x="691" y="378" fill="#8facbc" font-size="11" class="mono">PERCEIVE</text>
    <path d="M774 374H829M929 374H983" stroke="#5f869b"/><path d="M824 370L829 374 824 378M978 370L983 374 978 378" fill="none" stroke="#8cb3c5"/>
    <text x="844" y="378" fill="#bddae8" font-size="11" class="mono">REASON</text><text x="1001" y="378" fill="#dfb38b" font-size="11" class="mono">ACT</text>
    <rect x=".75" y=".75" width="1198.5" height="418.5" rx="25.25" fill="none" stroke="#c2dde9" stroke-opacity=".15" stroke-width="1.5"/>
  </g>
