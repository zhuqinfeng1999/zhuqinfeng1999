<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Qinfeng Zhu — From vision to embodied intelligence</title>
  <desc id="desc">A visual-to-action study: sensed geometry, an articulated robotic arm and a target cube, connected by a perception, reasoning and action loop.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080e14"/><stop offset="1" stop-color="#10222e"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#6fa9c9" stop-opacity=".2"/><stop offset="1" stop-color="#6fa9c9" stop-opacity="0"/></radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#354755"/><stop offset=".22" stop-color="#b5c8d5"/><stop offset=".43" stop-color="#f2f5f7"/><stop offset=".58" stop-color="#788e9f"/><stop offset="1" stop-color="#253743"/></linearGradient>
    <linearGradient id="joint"><stop stop-color="#253d4c"/><stop offset=".55" stop-color="#101b23"/><stop offset="1" stop-color="#5e7b8e"/></linearGradient>
    <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#162b38"/><stop offset="1" stop-color="#0c1821"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="420" rx="26"/></clipPath>
    <style>
      .sans{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace;letter-spacing:1.6px}.display{font-family:Georgia,Times New Roman,serif}.signal{animation:breathe 4s ease-in-out infinite}.next{animation-delay:-1.3s}.last{animation-delay:-2.6s}@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <ellipse cx="936" cy="187" rx="300" ry="268" fill="url(#light)"/>
    <path d="M598 48V370" stroke="#b4d5e7" stroke-opacity=".12"/>
    <text x="58" y="67" fill="#a9ddea" font-size="13" class="mono">VISION → REASONING → ACTION</text>
    <text x="55" y="152" fill="#f1f5f7" font-size="68" class="display">Qinfeng Zhu</text>
    <text x="59" y="191" fill="#91a9b8" font-size="19" class="sans">朱钦峰 · Ph.D. Researcher</text>
    <text x="57" y="270" fill="#dce8ee" font-size="37" class="display">From vision to</text>
    <text x="57" y="315" fill="#a9ddea" font-size="39" font-style="italic" class="display">embodied intelligence.</text>
    <text x="59" y="373" fill="#9cb1bf" font-size="12" class="mono">DUKE (KUNSHAN) UNIVERSITY · RESEARCH INTERN</text>

    <!-- Conceptual articulated mechanism; not a hardware or experimental claim. -->
    <g fill="none" stroke="#8bbfd3" stroke-opacity=".17">
      <path d="M672 273L952 350 1148 276 870 215Z" fill="url(#floor)"/>
      <path d="M717 256L998 333M765 237L1047 314M814 225L1097 295M725 287L920 231M790 305L984 248M855 324L1050 267"/>
      <path d="M711 220C698 106 830 63 951 86" stroke-dasharray="4 7"/>
      <path d="M1065 200C1152 258 1090 349 994 343" stroke-dasharray="4 7"/>
    </g>
    <g transform="translate(692 187)" stroke="#a9ddea" fill="#a9ddea">
      <path d="M-11 -29V-40H0M54 -40H65V-29M-11 30V41H0M54 41H65V30" fill="none" stroke-opacity=".5"/>
      <g stroke="none" class="signal">
        <circle cx="13" cy="-23" r="2"/><circle cx="27" cy="-19" r="2"/><circle cx="40" cy="-12" r="2"/>
        <circle cx="-1" cy="-12" r="2"/><circle cx="13" cy="-5" r="2"/><circle cx="27" cy="1" r="2"/><circle cx="40" cy="8" r="2"/>
        <circle cx="-1" cy="9" r="2"/><circle cx="13" cy="16" r="2"/><circle cx="27" cy="22" r="2"/>
      </g>
      <path d="M53 0H103" stroke-dasharray="3 6" stroke-opacity=".45"/>
    </g>
    <ellipse cx="1011" cy="314" rx="65" ry="15" fill="#03090e" opacity=".7"/>
    <path d="M967 296L1011 281 1057 296V310L1011 326 967 310Z" fill="url(#metal)" stroke="#abc4d1" stroke-opacity=".45"/>
    <path d="M988 299L978 240 1009 225 1031 246 1023 298Z" fill="url(#metal)" stroke="#d3e2e9" stroke-opacity=".45"/>
    <path d="M1000 241L961 127" stroke="#0a151d" stroke-width="45" stroke-linecap="round"/>
    <path d="M1000 241L961 127" stroke="url(#metal)" stroke-width="39" stroke-linecap="round"/>
    <path d="M965 124L858 164" stroke="#0a151d" stroke-width="40" stroke-linecap="round"/>
    <path d="M965 124L858 164" stroke="url(#metal)" stroke-width="34" stroke-linecap="round"/>
    <path d="M858 164L843 222" stroke="url(#metal)" stroke-width="27" stroke-linecap="round"/>
