<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Selected research highlights</title>
  <desc id="desc">Three visual research cards for SemanticUrban, SO3UFormer and Panoramic Scene Understanding.</desc>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a151d"/><stop offset="1" stop-color="#10232c"/></linearGradient>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101421"/><stop offset="1" stop-color="#1a1930"/></linearGradient>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1717"/><stop offset="1" stop-color="#13231e"/></linearGradient>
    <clipPath id="c1"><rect x="0" width="380" height="330" rx="22"/></clipPath><clipPath id="c2"><rect x="410" width="380" height="330" rx="22"/></clipPath><clipPath id="c3"><rect x="820" width="380" height="330" rx="22"/></clipPath>
    <style>.ui{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:SFMono-Regular,Consolas,monospace;letter-spacing:1.4px}.title{fill:#f0f6f7}.muted{fill:#7d939c}.point{animation:flicker 4s ease-in-out infinite}.p2{animation-delay:-1.3s}.p3{animation-delay:-2.7s}@keyframes flicker{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.point{animation:none}}</style>
  </defs>

