      <circle cx="132" cy="59" r="1.5"/><circle cx="156" cy="65" r="2.4"/><circle cx="181" cy="57" r="1.8" class="point p3"/><circle cx="207" cy="68" r="2"/><circle cx="234" cy="62" r="2.4"/><circle cx="260" cy="72" r="1.5"/>
      <circle cx="117" cy="89" r="2"/><circle cx="143" cy="96" r="1.4"/><circle cx="172" cy="87" r="2.6"/><circle cx="202" cy="99" r="1.7"/><circle cx="232" cy="91" r="2.2"/><circle cx="268" cy="97" r="1.8"/>
